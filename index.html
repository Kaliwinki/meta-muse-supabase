<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Muse — Accueil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre de navigation : onglets à gauche, connexion en haut à droite -->
  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#/">Meta Muse</a>
      <div class="nav-links">
        <a href="#/" data-nav="accueil">Accueil</a>
        <a href="#/blog" data-nav="blog">Blog</a>
      </div>
      <div id="auth-area" class="auth-area"></div>
    </div>
  </nav>

  <main id="view"></main>

  <footer>
    <p class="small">Meta Muse — site hébergé gratuitement sur GitHub Pages, comptes et blog propulsés par Supabase.</p>
  </footer>

  <!-- Fenêtre de connexion / inscription -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" type="button" aria-label="Fermer">×</button>
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Connexion</button>
        <button id="tab-signup" class="tab" type="button">Inscription</button>
      </div>
      <div id="auth-message" class="message hidden" role="alert"></div>

      <form id="login-form" class="form">
        <h2>Se connecter</h2>
        <label for="login-email">Adresse e-mail</label>
        <input id="login-email" type="email" autocomplete="email" required>
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary">Se connecter</button>
      </form>

      <form id="signup-form" class="form hidden">
        <h2>Créer un compte</h2>
        <label for="signup-username">Nom d'utilisateur</label>
        <input id="signup-username" type="text" autocomplete="username" maxlength="20" placeholder="ex. marie_2026" required>
        <p class="small" style="margin-top:-0.3rem">C'est ce pseudo qui apparaîtra publiquement sur le blog — ton adresse e-mail reste privée.</p>
        <label for="signup-email">Adresse e-mail</label>
        <input id="signup-email" type="email" autocomplete="email" required>
        <label for="signup-password">Mot de passe (6 caractères minimum)</label>
        <input id="signup-password" type="password" autocomplete="new-password" minlength="6" required>
        <button type="submit" class="primary">S'inscrire</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
